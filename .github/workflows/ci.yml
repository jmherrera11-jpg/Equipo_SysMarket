name: SysMarket CI Pipeline

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Run Unit Tests
        run: mvn clean test -Dtest=AllUnitTests
      - name: Run Integration Tests
        run: mvn test -Dtest=AllIntegrationTests
        env:
          MONGODB_HOST: localhost
          MONGODB_PORT: 27017